<!doctype html>
<!-- Shown by src-tauri/src/webcrash.rs when the page's web process died three
     times inside five minutes, instead of reloading it forever. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mulpex</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #1a1b26; color: #c0caf5;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 34em; padding: 2em; }
      h1 { font-size: 1.3em; margin: 0 0 .6em; }
      p { margin: 0 0 .8em; color: #a9b1d6; }
      button {
        margin-top: .6em; padding: .5em 1.2em; border: 0; border-radius: 6px;
        background: #7aa2f7; color: #1a1b26; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mulpex's window keeps crashing</h1>
      <p>Its page crashed three times in five minutes, so it was not reloaded again.</p>
      <p>Your claudes and terminals are still running. Try again, or quit and reopen Mulpex.</p>
      <button onclick="location.href = '/'">Try again</button>
    </main>
  </body>
</html>
