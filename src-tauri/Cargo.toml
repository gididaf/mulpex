[package]
name = "mulpex"
version = "0.55.1"
edition = "2021"
description = "Multiple coordinated Claude Code sessions in a native desktop app"
default-run = "mulpex"

[lib]
name = "mulpex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mulpex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The wire fingerprint (build.rs): which Mulpex versions can drive each other.
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
mulpex-core = { path = "../crates/mulpex-core" }
mulpex-ptyd = { path = "../crates/mulpex-ptyd" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.3.3"
# Remote Control (`remote/`): a blocking client on its own thread, like the
# rest of the backend, and the pairing QR code drawn as SVG.
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# End-to-end encryption between this Mac and a paired phone (`remote/crypto.rs`);
# the phone runs the same primitives from @noble.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Remote Hosts (`remote/desktop.rs`, `client.rs`): screens and big output go
# deflated through the relay.
flate2 = "1"
# Web Push from the Mac straight to a paired phone (`remote/push.rs`): VAPID
# signing and the RFC 8291 payload encryption, sent with a small blocking client.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
ureq = "3"
# Live Token (`live_token.rs`): a local HTTP proxy that puts the current OAuth
# token on every claude's API requests. All already in the tree via tauri and
# the updater; named here for the features the proxy needs.
tokio = { version = "1", features = ["net", "process", "time", "sync", "rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Linux only: Super+C / Super+V go through the webview there (no native Edit
# menu), and WebKitGTK cannot be relied on to let script read the clipboard.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-clipboard-manager = "~2.3"
