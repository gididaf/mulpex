[package]
name = "mulpex"
version = "0.7.2"
edition = "2021"
description = "Multiple coordinated Claude Code sessions in a native desktop app"
default-run = "mulpex"

[lib]
name = "mulpex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mulpex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
mulpex-core = { path = "../crates/mulpex-core" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.3.3"
