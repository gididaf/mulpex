# Mulpex CLI's tmux config. Shipped and owned by `mpx`, loaded with `-f`, and the
# user's ~/.tmux.conf is deliberately NOT sourced — so `mpx` behaves identically
# on a Mac and on every server, with nothing to install or keep in sync remotely.
#
# The settings below are load-bearing, not taste. Each one has a reason.

# --- prefix -------------------------------------------------------------------
# Ctrl-Q, not tmux's Ctrl-B. Measured against the claude binary's own key tables:
# essentially every plain Ctrl+<letter> is spoken for (Ctrl-B included), while
# Ctrl-Q shows zero hits. It is not a readline binding and neither macOS nor
# iTerm2 claims it. Its one classic hazard, XON flow control, does not apply
# because tmux puts the tty in raw mode.
#
# No ⌘ shortcuts exist here and none can: no macOS terminal delivers ⌘ to the
# pty. That is why the desktop app's keymap does not transfer.
set -g prefix C-q
unbind C-b
bind C-q send-prefix          # C-q C-q types a literal Ctrl-Q into claude

# --- dead panes ---------------------------------------------------------------
# `remain-on-exit` keeps a window after its process dies, which is what preserves
# "a session that failed to start is kept, not reaped" — the row whose entire
# purpose is still showing its error.
set -g remain-on-exit on
# ...but tmux then paints "Pane is dead (status 3, <date>)" OVER the visible
# screen. The program's output survives in scrollback, yet a screen capture would
# return the banner instead of the error. Emptying the format suppresses the
# banner while `#{pane_dead}` and `#{pane_dead_status}` keep working. (Measured
# 2026-09-05.)
set -g remain-on-exit-format ''

# --- closing the last instance of a project ------------------------------------
# A project IS a tmux session, so closing its last instance kills its last window
# and tmux destroys the session. tmux's default then **detaches the client** — so
# closing one project dropped you out of Mulpex entirely, with your other projects
# still running and no longer on screen. Reported exactly that way, and it reads as
# a crash rather than a close.
#
# `off` switches the client to another session instead, which is what a tab bar
# promises: shut one tab, land on the next.
#
# There is no zero-project state to fall back to here, unlike the desktop app: a
# tmux session with no windows does not exist, so the last project closing really
# does end the client. That case detaches, and `mpx` brings you back.
set -g detach-on-destroy off

# --- transcript ---------------------------------------------------------------
# tmux's scrollback IS the terminal transcript now; `vtgrid.rs` is not in the
# picture. `capture-pane -J -S -<history delta>` is how a claude reads a terminal.
set -g history-limit 50000

# --- keys and colour ----------------------------------------------------------
set -g escape-time 0          # else Esc to claude is delayed and read as Meta
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g status-interval 1

# Extended keys let Shift+Enter reach claude as a distinct key rather than a bare
# CR. Verified separately that `send-keys -H 1b 0d` is byte-exact in raw mode, so
# an explicit binding is available as a fallback if this proves unreliable.
set -s extended-keys always

# ...and this is what asks the *outer* terminal to send them, which is the only
# thing that can make `C-[` bindable — see the C-[ block below. tmux otherwise
# negotiates extended keys only with a terminal it already knows supports them.
# The enable sequence is a CSI a terminal that does not understand it swallows
# silently, so declaring it broadly is safe; the failure mode is C-[ staying dead,
# not garbage on screen.
set -as terminal-features ',*:extkeys'

# --- status -------------------------------------------------------------------
# Phase 4 replaces this with the real instance list; Phase 1 just needs to see
# which window is which.
set -g status-left "#[bold] mpx #S #[default] "
set -g status-right " #{?session_attached,,detached }%H:%M "
set -g status-left-length 40

# --- the messages feed ---------------------------------------------------------
# The one key binding that ships ahead of the rest of the scheme (which is still
# open — see "Deferred: the key scheme"). It earns its place because the feed is
# the only record of a message: an instance's inbox is drained the moment it is
# read, so by the time anyone looks, this is all there is.
#
# `display-popup -E` floats above the panes and closes on exit, so it resizes
# nothing — and resizing is the one thing that corrupts a pane for good.
bind M display-popup -E -w 80% -h 70% "mpx messages 60; echo; echo '[any key]'; read -r -k1 -s 2>/dev/null || read -n1"

# --- the Mulpex layout ---------------------------------------------------------
# Every instance window is [ sidebar | instance ]. The sidebar is an ordinary pane
# running `mpx sidebar`; tmux does the splitting, the resizing and the drawing of
# the instance beside it. See src/layout.rs.

# Project tabs, along the top. `#{S:...}` loops over sessions, and a session is a
# project — so this is the whole tab bar, with no process behind it.
set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left ""
set -g status-right ""
set -g status-justify left
set -g status-format[0] "#{S:#{?#{==:#{session_name},#{client_session}},#[fg=colour252#,bold reverse] #{session_name} #[default],#[fg=colour245] #{session_name} #[default]}}"

# The window bar is gone: the sidebar IS the instance list, and two lists that
# disagree are worse than one.
set -g window-status-format ""
set -g window-status-current-format ""

# A thin rule between the sidebar and the instance, not a box.
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour238"

# --- the bare keys ---------------------------------------------------------------
# `-n` is the root table: no prefix, one keystroke, and each key is therefore taken
# away from claude and the shell for good. Five are spent: C-] C-[ C-t C-w C-p.
#
# What a key costs is not how often *you* would press it — it is what the programs
# underneath lose. Measured against claude 2.1.263 and zsh:
#
#   C-p  6 refs, and every one is "move up" with `up` and `k` bound beside it
#        ("ctrl+p":"select:previous" next to up:"select:previous"). zsh binds it to
#        up-line-or-history, which the arrow also does. Taking it removes an ALIAS.
#   C-t  10 refs — claude's own, no alias. The prefix route is the way back.
#   C-w  2 refs in claude, but readline's delete-word-backward, which is a primary
#        binding used while typing. The most expensive of the five.
#
# So an alias-only key is nearly free and a primary is not, and that difference is
# worth more than the raw reference count it is usually mistaken for.
#
# Measured 2026-09-06 by driving a real client (`send-keys` CANNOT test this — it
# writes into a pane and never passes through the key tables at all):
#   C-] C-\ C-^ C-_ C-Space C-s C-g C-t   all fire from the root table
#   C-[  as raw 0x1b                       fires the ESCAPE binding
#   C-[  as ESC[91;5u or ESC[27;5;91~      fires C-[
#
# So C-[ is bindable *only* where the terminal reports extended keys, because
# `C-[` IS byte 0x1b — it is Escape, not a key resembling it. That is why
# prev-instance never worked in the legacy terminal Mulpex. Two consequences worth
# knowing: tmux accepts `bind -n C-[`, exits 0 and lists it whether or not it can
# ever fire (a real event with nowhere to arrive — verify by pressing it, never by
# reading `list-keys`); and binding it does **not** steal Escape, since raw 0x1b
# still reaches the Escape binding. The failure mode is C-[ doing nothing, which is
# why `C-q p` stays available as the prefix route to the same place.

# Move between instances, in the order the sidebar lists them.
#
# NOT `next-window`. tmux orders windows by index and Mulpex orders instances by
# id, and the two drift apart the moment an index is reused — which happens on
# every project, because `up()` frees index 0 when it kills the placeholder, so
# the second claude was created *in front of* the first. Reported as "[ and ]
# reversed"; it was not reversed, it was arbitrary. `mpx key next` walks the list
# the user is actually looking at, and lands in the instance pane rather than the
# sidebar strip because that is the pane the list holds.
#
# `>/dev/null 2>&1` is NOT tidiness. Measured 2026-09-06: `run-shell` displays any
# output the command produced by putting **the pane you are looking at** into
# view-mode — a copy-mode overlay with a yellow `[0/0]` in the corner, hiding a
# perfectly healthy claude behind one line of text. `mpx new` printing its reply
# ("claude#2") was enough to do it. A key binding must be silent; anything it needs
# to say goes to `display-message`, which is the status line and not a pane.
bind -n C-] run-shell -b "__MPX_BIN__ key next #{window_id} >/dev/null 2>&1"
bind -n C-[ run-shell -b "__MPX_BIN__ key prev #{window_id} >/dev/null 2>&1"

# New claude. `-b` because `mpx new` waits on a daemon tick and a foreground
# run-shell blocks the whole tmux server — every pane in every project freezes.
#
# A window id (`@12`) is passed rather than the project path: `#{q:...}` escapes
# for *tmux*, not for the shell (measured — a path containing a quote came through
# raw), so a project directory must never reach a command line this way. `mpx key`
# reads the path back out of tmux itself. `__MPX_BIN__` is substituted, shell-
# quoted, when the config is rendered — see `main.rs::render_conf`.
bind -n C-t run-shell -b "__MPX_BIN__ key new #{window_id} >/dev/null 2>&1"

# Close this instance. `confirm-before` puts the question on the status line and
# runs the command only on `y` — every other key cancels.
#
# Closing a claude ends a conversation with no undo, and C-w sits next to C-e and
# C-q. It also costs more than the other two keys: readline binds it to
# delete-word-backward and the claude binary references ctrl+w five times, so this
# is a key the user was already using while typing. `C-q C-w` sends it through.
bind -n C-w confirm-before -p "close #{window_name}? (y/n)" "run-shell -b \"__MPX_BIN__ key close #{window_id} >/dev/null 2>&1\""
bind C-w send-keys C-w

# claude binds ctrl+t itself, so this is the way back to it: the prefix route sends
# the literal byte through. Same for C-], C-[ and C-p.
bind C-t send-keys C-t
bind C-] send-keys C-]
bind C-[ send-keys C-[
bind C-p send-keys C-p

# The sidebar pane. Deliberately NOT advertised any more, and it is the only thing
# in this file that is bound but not part of the scheme.
#
# The sidebar is a *display*: it is on screen in every window and needs no key to be
# read. Focusing it only ever mattered for the actions with no bare key — and four
# of the five are commands you can type instead (`mpx term`, `mpx mute`,
# `mpx restart`, `mpx messages`), which is where they now live. The fifth is rename,
# which stays sidebar-only because the name must never touch a command line
# (`#{q:...}` is not shell quoting — measured), and is parked for now.
#
# Kept bound because it costs nothing and tmux's own pane navigation reaches this
# pane regardless; removing it would only make the pane harder to leave.
# `.0` is the sidebar by construction (layout.rs).
bind s select-pane -t .0

# The project picker: open projects, then recents, then anything on disk. One
# popup that is both the switcher and the opener, so `p` is the only key for
# "which project?" — see src/picker.rs.
#
# This overrides tmux's own prefix-p (previous-window), deliberately. That binding
# walks windows by index, and a Mulpex window index is an implementation detail
# nobody is looking at; `<`/`>` in the sidebar and this popup are the two ways to
# change project, and both of them agree with the tab bar.
#
# `-E` closes the popup when `mpx pick` exits, and the picker does its own
# `switch-client` — there is nowhere for a popup to *return* a chosen path to.
#
# `display-popup` directly, never via `run-shell`: run-shell either blocks the whole
# server (foreground) or shows its output by dropping the pane you are looking at
# into view-mode (background) — both measured. A popup is tmux's own async thing and
# has neither problem, so the three keys that shell out do it and this one does not.
bind -n C-p display-popup -E -w 70% -h 60% "__MPX_BIN__ pick"
bind    p   display-popup -E -w 70% -h 60% "__MPX_BIN__ pick"
