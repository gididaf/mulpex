[package]
name = "mulpex-cli"
version = "0.4.6"
edition = "2021"

# `mpx` — the tmux-backed CLI Mulpex. tmux owns every PTY, so this crate links no
# terminal emulator: it drives `tmux` and shares the coordination hub with the
# desktop app through `mulpex-core`.
[[bin]]
name = "mpx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
mulpex-core = { path = "../mulpex-core" }
# The Unicode Bidirectional Algorithm, for text `mpx` itself prints. Measured in
# Phase 0: iTerm2 at default settings does NOT reorder RTL — it draws codepoints
# in storage order — so Hebrew has to be converted logical → visual before it is
# written out. This is a call into the UBA, not an implementation of it; see
# `bidi.rs` for why it must stay a setting rather than being unconditional.
unicode-bidi = "0.3"
# Raw terminal mode for the sidebar, which reads single keystrokes. Only
# `tcgetattr`/`tcsetattr` and `ioctl(TIOCGWINSZ)` — no runtime, no allocation.
libc = "0.2"
