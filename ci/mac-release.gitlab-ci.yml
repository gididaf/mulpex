# The unattended Mulpex release: the CI file of GitLab project root/mulpex-release
# (gitlab.dreamvps.com, id 67), which holds nothing else. scripts/release-auto.sh
# uploads THIS file there whenever it differs, so edit it here, never in GitLab.
#
# It runs on the Mac's GitLab runner (gidi-mac, tag macos, shell executor, as
# gididaf in the GUI session, so the login keychain's signing identity and
# ~/.mulpex/updater.key are reachable) and does exactly what `npm run release`
# does by hand, in its own clone, ~/mulpex-release — never in the live checkout
# the Mac's claudes work in. docs/packaging.md, "Unattended release".
#
# Variables (set by release-auto.sh when it triggers the pipeline):
#   MULPEX_SHA      the bump commit to release; must already be on origin/master
#   MULPEX_VERSION  its version, checked against tauri.conf.json
#
# NEVER add `set -x` (or any trace) here: release.sh exports the updater key's
# contents (TAURI_SIGNING_PRIVATE_KEY), and the shell executor would print it
# into the GitLab job log.

workflow:
  rules:
    - if: $MULPEX_SHA && $MULPEX_VERSION

release:
  tags: [macos]
  timeout: 75m
  variables:
    GIT_STRATEGY: none # this project has no code; the job clones GitHub itself
  script:
    - |
      set -euo pipefail
      # launchd gives the runner a bare environment and there is no ~/.bash_profile,
      # so a login bash finds neither node nor cargo (measured 2026-11-04).
      export PATH="/opt/homebrew/bin:$PATH"
      export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
      . "$HOME/.cargo/env"
      D="$HOME/mulpex-release"
      [ -d "$D/.git" ] || git clone https://github.com/gididaf/mulpex.git "$D"
      cd "$D"
      git fetch --tags --force --prune origin
      git merge-base --is-ancestor "$MULPEX_SHA" origin/master || {
        echo "ERROR: $MULPEX_SHA is not on origin/master — push it first." >&2; exit 1; }
      # A real branch with an upstream, not a detached HEAD: release.sh's
      # preflight counts @{upstream}..HEAD. HEAD being an ancestor of
      # origin/master gives 0 even if master moved on since the trigger, and
      # --target in release.sh tags exactly this commit.
      git checkout -f -B master "$MULPEX_SHA"
      git branch -u origin/master
      # Keep the caches (node_modules, the Rust target dir), drop everything else.
      git clean -ffdx -e node_modules -e target
      V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
      [ "$V" = "$MULPEX_VERSION" ] || {
        echo "ERROR: $MULPEX_SHA is version $V, not $MULPEX_VERSION." >&2; exit 1; }
      # Never publish over a newer release: --latest would point every client
      # back at this one (and the updater ignores a downgrade anyway).
      NEWEST="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)"
      if [ -n "$NEWEST" ] && [ "$NEWEST" != "v$V" ] \
         && [ "$(printf '%s\n' "$NEWEST" "v$V" | sort -V | tail -1)" = "$NEWEST" ]; then
        echo "ERROR: $NEWEST is newer than v$V — release a newer version instead." >&2; exit 1
      fi
      npm ci --no-audit --no-fund
      # Resume: a run that failed after `gh release create --draft` (usually the
      # Linux leg) left a draft with the Mac assets. release.sh would refuse it
      # ("already exists"), so finish it the way release.sh's error says to.
      if [ "$(gh release view "v$V" -R gididaf/mulpex --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
        gh release view "v$V" -R gididaf/mulpex --json assets -q '.assets[].name' | grep -qx 'Mulpex.app.tar.gz' || {
          echo "ERROR: draft v$V has no Mac build — delete the draft, then retry." >&2; exit 1; }
        echo "==> resuming draft v$V: Linux build + publish"
        scripts/release-linux.sh --host "${MULPEX_LINUX_HOST:-gidi@89.42.24.40}"
        gh release edit "v$V" -R gididaf/mulpex --draft=false --latest
        echo "==> published v$V"
        exit 0
      fi
      npm run release
